spring.application.name=BE-SWP

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=swp391_db;encrypt=false;trustServerCertificate=true;characterEncoding=UTF-8;useUnicode=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET:dev-only-login-secret-change-before-production-32-chars}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# The frontend exchanges the one-time code for the existing JWT response.
app.oauth2.google.success-redirect=${GOOGLE_SUCCESS_REDIRECT:http://localhost:5173/auth/google/callback}
app.oauth2.google.failure-redirect=${GOOGLE_FAILURE_REDIRECT:http://localhost:5173/login}
app.oauth2.google.exchange-code-ttl-seconds=${GOOGLE_EXCHANGE_CODE_TTL_SECONDS:60}

server.port=8080

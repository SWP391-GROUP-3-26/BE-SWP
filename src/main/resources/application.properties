spring.application.name=BE-SWP

# OTP email: no embedded credentials; without SMTP, OTP endpoints fail with 503.
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
# Validation exception DEBUG messages can contain rejected password/OTP field values.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=swp391_db;encrypt=false;trustServerCertificate=true;characterEncoding=UTF-8;useUnicode=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.hikari.data-source-properties.sendTimeAsDatetime=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jackson.deserialization.accept-float-as-int=false

security.jwt.secret=${JWT_SECRET:dev-only-login-secret-change-before-production-32-chars}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# The frontend exchanges the one-time code for the existing JWT response.
app.oauth2.google.success-redirect=${GOOGLE_SUCCESS_REDIRECT:http://localhost:5173/auth/google/callback}
app.oauth2.google.failure-redirect=${GOOGLE_FAILURE_REDIRECT:http://localhost:5173/login}
app.oauth2.google.exchange-code-ttl-seconds=${GOOGLE_EXCHANGE_CODE_TTL_SECONDS:60}

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# VNPay Sandbox domestic card payments. No fallback credentials.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:}
app.vnpay.frontend-url=${VNPAY_FRONTEND_URL:}

# E_Wallet uses SePay QR + authenticated webhook. Configure Test mode first.
app.sepay.enabled=${SEPAY_ENABLED:false}
app.sepay.test-mode=${SEPAY_TEST_MODE:true}
app.sepay.bank-code=${SEPAY_BANK_CODE:}
app.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
app.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
app.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}

# Chat images are stored outside the application package.
app.upload.chat-dir=${CHAT_UPLOAD_DIR:uploads/chat}

# A package-expiry notification appears this many days before End_Date.
app.notification.package-expiry-days=${MEMBER_NOTIFICATION_EXPIRY_DAYS:7}
